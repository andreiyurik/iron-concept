# Zone 1 — tomatoes. Sensors on ESP32 node 1 (Modbus TCP).
zone_1:
  air_temperature:
    source: modbus://gh-node-1/holding/0x0000
    type: float32
    unit: "°C"
    scan_rate: 5s
    deadband: 0.3
    range: [-10, 60]
    alarms:
      low_low:
        limit: 2
        priority: 1
        message: "Zone 1 frost risk — crop damage below 2°C"
      low:
        limit: 8
        priority: 2
        message: "Zone 1 air temperature low"
      high:
        limit: 38
        priority: 2
        message: "Zone 1 air temperature high — check vent"

  humidity:
    source: modbus://gh-node-1/holding/0x0002
    type: float32
    unit: "%RH"
    scan_rate: 10s
    deadband: 2
    range: [0, 100]
    alarms:
      high:
        limit: 90
        priority: 3
        message: "Zone 1 humidity high — condensation and fungus risk"

  # Vapour-pressure deficit — what the crop actually feels. Computed, not
  # measured: a derived tag (docs/specs/expressions.md). Both inputs belong
  # to this site's one edge, so it is evaluated there and its alarm works
  # without a server.
  vpd:
    derived: "0.6108 * exp(17.27 * zone_1.air_temperature / (zone_1.air_temperature + 237.3)) * (1 - zone_1.humidity / 100)"
    type: float32
    unit: "kPa"
    deadband: 0.05
    range: [0, 8]
    alarms:
      high:
        limit: 1.6
        priority: 3
        message: "Zone 1 VPD high — plants closing stomata, check humidity"

  soil_moisture_bed_a:
    source: modbus://gh-node-1/holding/0x0004
    type: float32
    unit: "%"
    scan_rate: 60s
    deadband: 1
    range: [0, 100]
    alarms:
      low:
        limit: 25
        priority: 2
        message: "Bed A soil dry — irrigation may have failed"

  soil_moisture_bed_b:
    source: modbus://gh-node-1/holding/0x0006
    type: float32
    unit: "%"
    scan_rate: 60s
    deadband: 1
    range: [0, 100]
    alarms:
      low:
        limit: 25
        priority: 2
        message: "Bed B soil dry — irrigation may have failed"

  co2:
    source: modbus://gh-node-1/holding/0x0008
    type: uint16
    unit: "ppm"
    scan_rate: 30s
    deadband: 20
    range: [0, 5000]
    alarms:
      high:
        limit: 1500
        priority: 3
        message: "Zone 1 CO2 above enrichment target"
